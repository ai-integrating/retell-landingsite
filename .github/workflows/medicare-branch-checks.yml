name: Medicare branch safety checks

on:
  push:
    branches:
      - feature/medicare-conversation-flow
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check provisioning syntax
        run: node --check api/provision.js
      - name: Run offline provisioning evidence tests
        run: node --require ./test/network-block.cjs --test test/provisioning-evidence.test.js
      - name: Run offline refinement tests
        run: npm run test:refinement
